version: 2

# Only GitHub Actions. The Dockerfiles under containers/ are deliberately one
# per distro release (ubuntu:22.04, rockylinux:8, ...), so a "newer base image"
# proposal there would turn one build target into a duplicate of another.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
