name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so the pinned tarball is re-verified even when nobody pushes.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ansible ansible-lint
      # Without community.general installed, ansible-lint cannot tell that
      # zypper lives there and silently skips the fqcn check for it.
      - run: ansible-galaxy collection install -r requirements.yml
      # ansible-lint also validates the Galaxy metadata schema, so there is no
      # separate job for it.
      - run: ansible-lint tasks/ defaults/ handlers/ meta/
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning build.sh scripts/*.sh scripts/lib/*.sh containers/*.sh

  build:
    # The matrix lives in build.yml, shared with the release workflow.
    uses: ./.github/workflows/build.yml

  pin:
    name: Pinned source still matches upstream
    # Only on the schedule: on a push the build job downloads and verifies the
    # same tarball anyway, so running this too would just be a second curl.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/verify-pin.sh
