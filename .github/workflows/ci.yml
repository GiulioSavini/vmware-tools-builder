name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so the pinned tarball is re-verified even when nobody pushes.
    - cron: '0 6 * * 1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ansible ansible-lint
      # ansible-lint also validates the Galaxy metadata schema, so there is no
      # separate job for it.
      - run: ansible-lint tasks/ defaults/ handlers/ meta/
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning build.sh scripts/*.sh scripts/lib/*.sh containers/*.sh

  build:
    name: Compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
          - debian12
          - rocky8
          - rocky9
          - oraclelinux8
          - oraclelinux9
          - fedora
    steps:
      - uses: actions/checkout@v4
      # This is the real gate: it builds the per-distro image and compiles
      # open-vm-tools inside it, producing the package. Everything else here is
      # a lint.
      - name: Build container and compile open-vm-tools
        working-directory: containers
        run: ./build-all.sh --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vmtools-${{ matrix.target }}
          path: output/${{ matrix.target }}/*
          if-no-files-found: warn

  pin:
    name: Pinned source still matches upstream
    # Only on the schedule: on a push the build job downloads and verifies the
    # same tarball anyway, so running this too would just be a second curl.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-pin.sh
